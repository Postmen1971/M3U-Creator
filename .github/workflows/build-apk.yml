name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M3U-Creator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as release (fixed download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk M3U-Creator.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk M3U-Creator.apk \
            --title "M3U Creator (aktueller Build)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Direkter Download: https://github.com/${{ github.repository }}/releases/latest/download/M3U-Creator.apk" \
            --target "$GITHUB_SHA" --latest
